# =============================================================================
# Default configuration for Lucid: accelerated MRI reconstruction.
#
# Experiment configs in this directory override these values; CLI arguments
# override those in turn:
#   python main.py train --config configs/swinunet.yaml training.lr=5e-5
#
# Every key here is validated on load (see config.py). Unknown keys are an
# error, not a silent no-op.
# =============================================================================

# -- Model --------------------------------------------------------------------
model:
  name: swinunet             # unet | norm_unet | bt_unet | swinunet
  complex: false             # 2-channel (real, imag) I/O; forced true when DC is on

  # Architecture hyperparameters. Left empty on purpose: per-model defaults live
  # in models/registry.py, which is the only place that knows which arguments a
  # given backbone accepts. Putting SwinUNet's parameters here would leak them
  # into `model.name=unet` runs, where strict validation would then (correctly)
  # reject `embed_dim` as unknown.
  #
  # SwinUNet accepts: img_size, patch_size, embed_dim, ws, head_dim, n_levels,
  #   depths, n_heads, mlp_ratio, dropout, attn_dropout, drop_path_rate,
  #   residual, use_checkpoint, use_sdpa
  # UNet / NormUNet accepts: base_ch, n_levels, norm, dropout, residual,
  #   residual_blocks
  # BT-UNet accepts: base_ch, n_levels, tf_heads, tf_layers, tf_dropout,
  #   img_size, norm, residual
  params: {}

  data_consistency:
    enabled: false           # requires data.undersample_domain = cropped
    mode: cascade            # cascade (unrolled) | single
    n_cascades: 4
    share_weights: false
    hard: false              # true = overwrite measured lines exactly

# -- Data ---------------------------------------------------------------------
data:
  train_dir: data/knee_singlecoil_train
  val_dir: data/knee_singlecoil_val
  center_fraction: 0.08      # fraction of low-frequency lines always acquired
  acceleration: 4            # int, or a list like [4, 8] to train across factors
  crop_size: [320, 320]
  mask_type: random          # random | equispaced | magic
  slice_mode: middle         # middle | all | range:start:end
  normalization: zf_max      # zf_max | attr_max | none
  undersample_domain: cropped  # cropped (exact data consistency) | full (legacy)
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  cache_dataset: false
  max_files: null            # limit volumes, for smoke tests

# -- Training -----------------------------------------------------------------
training:
  epochs: 50
  batch_size: 4
  seed: 42
  deterministic: false       # true is bit-reproducible but 5-20% slower
  val_split: 0.1             # used only when val_dir is missing

  optimizer: adamw           # adam | adamw | sgd
  lr: 8.0e-5
  weight_decay: 1.0e-4       # never applied to norms, biases or position biases
  betas: [0.9, 0.999]

  scheduler: warmup_cosine   # warmup_cosine | warmup_linear | warmup_restart
                             # | cosine | step | plateau | none
  warmup_epochs: 5           # converted to steps internally
  eta_min_factor: 0.01

  loss:
    l1_weight: 0.7
    ssim_weight: 0.3
    freq_weight: 0.0         # k-space error; helps recover high frequencies
    edge_weight: 0.0         # Sobel boundary loss
    perceptual_weight: 0.0   # VGG features; downloads weights when > 0
    charbonnier: false

  gradient_clip: 1.0
  augmentation: true         # applied to the complex image before undersampling
  patience: 10

  amp: true
  amp_dtype: auto            # auto | float16 | bfloat16

  ema:
    enabled: true
    decay: 0.999
    warmup_steps: 1000
    include_buffers: true

  gradient_accumulation: 1
  compile: false
  channels_last: false

  monitor: val_loss          # metric driving early stopping and best.pt
  monitor_mode: min          # min | max  (use max with val_psnr / val_ssim)
  max_steps_per_epoch: null  # cap batches per epoch, for smoke tests

# -- Logging ------------------------------------------------------------------
logging:
  output_dir: outputs
  experiment_name: swinunet_default
  tensorboard: true
  wandb: false
  wandb_project: lucid-mri
  wandb_entity: null
  log_interval: 25           # optimiser steps between batch-level logs
  save_top_k: 3              # retained by monitored metric, not by mtime
  log_images: true
  unique_run_dir: true       # timestamp new runs instead of overwriting

# -- Inference ----------------------------------------------------------------
inference:
  checkpoint: null
  export_onnx: false
  onnx_path: exports/model.onnx
  tta: false
  mc_dropout_samples: 0
